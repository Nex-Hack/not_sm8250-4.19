name: build not-kernel CI sm8250

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        device: [y2q]

    env:
      DEVICE_NAME: Galaxy S20 Series
      KERNEL_NAME: not_kernel

    steps:
      - name: Check Out
        uses: actions/checkout@v3

      - name: Set Timezone
        uses: szenius/set-timezone@v1.2
        with:
          timezoneLinux: "America/Sao_Paulo"

      - name: Setting up the environment
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-aarch64-linux-gnu bc flex bison libssl-dev libncurses5-dev zip clang lld

      - name: Set Build Start Time
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Make build script executable
        run: chmod +x build-${{ matrix.device }}.sh

      - name: Run build script
        run: ./build-${{ matrix.device }}.sh

      # 🔹 New step: Verify kernel config
      - name: Check FUSE_BPF status
        run: |
          if grep -q "CONFIG_FUSE_BPF=y" out/.config; then
            echo "FUSE_BPF is enabled! Disabling..."
            scripts/config --file out/.config --disable FUSE_BPF
            make O=out ARCH=arm64 olddefconfig
          else
            echo "FUSE_BPF already disabled."
          fi

      - name: Set Build End Time
        run: echo "END_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Calculate Build Duration
        run: |
          duration=$((END_TIME - START_TIME))
          minutes=$((duration / 60))
          seconds=$((duration % 60))
          echo "BUILD_DURATION=${minutes}m ${seconds}s" >> $GITHUB_ENV

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Not_kernel_${{ matrix.device }}
          path: |
            out/*.zip
            *.zip
